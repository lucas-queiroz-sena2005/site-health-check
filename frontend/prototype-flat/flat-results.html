<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE – Scan results (throwaway)</title>
<style>
:root{--text:#1f2328;--muted:#656d76;--line:#d0d7de;--zebra:#f6f8fa;--hover:#eaf2ff;--head:#eef1f4;--accent:#0969da;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px}
.banner{background:#fff8c5;border:1px solid #d4a72c;padding:8px 12px;font-size:13px;margin-bottom:16px}
h1{font-size:22px;font-weight:600;margin:0 0 2px}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.summary{display:flex;gap:28px;margin:14px 0 18px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.summary div b{display:block;font-size:20px;font-weight:600}.summary div span{font-size:12px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 16px;font:inherit;cursor:pointer}
.tab:hover{color:var(--text)}.tab.active{color:var(--text);font-weight:600;border-color:#fd8c73}
.tab small{background:#d0d7de66;border-radius:99px;padding:0 7px;margin-left:6px;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input,select,button.btn{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit}
button.btn{background:var(--zebra);cursor:pointer}button.btn:hover{background:#eaeef2}
button.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;gap:6px;align-items:center;background:#ddf4ff;color:#0550ae;border-radius:99px;padding:2px 10px;font-size:12px}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0;font-size:14px}
table{width:100%;border-collapse:collapse;border:1px solid var(--line)}
th{text-align:left;font-weight:600;font-size:13px;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:#e3e7eb}
td{padding:7px 12px;border-bottom:1px solid #eaeef2;vertical-align:middle}
tbody tr:nth-child(even){background:var(--zebra)}tbody tr:hover{background:var(--hover)}
tr.skipped td{color:var(--muted);font-style:italic}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font:inherit}.link:hover{text-decoration:underline}
.badge{display:inline-block;padding:0 7px;border:1px solid var(--line);border-radius:99px;font-size:12px;margin-right:4px;background:#fff}
.ok{color:var(--ok);border-color:#4ac26b}.warn{color:var(--warn);border-color:#d4a72c}.bad{color:var(--bad);border-color:#ff8182}.info{color:var(--accent);border-color:#54aeff}
.pager{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#1f232840;display:none}.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:680px;max-width:100%;background:#fff;border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);transition:transform .15s;box-shadow:-8px 0 24px #1f23281f}
.drawer.open{transform:none}
.drawer h2{margin:0 0 4px;font-size:18px}
.drawer h3{font-size:13px;font-weight:600;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.drawer table{font-size:13px}.x{float:right}
</style></head><body><div class="wrap">

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MAXD=2;

/* ---------- model: Host -> Services (open ports) -> Checks (per vhost) ---------- */
const hosts=RAW.map(h=>({ip:h.ip,names:h.names,depth:h.depth,skipped:h.skipped,root:h.root,
  scanned:h.ports.length,ports:h.ports.filter(p=>p.tcp==='open')}));
const byIp=new Map(hosts.map(h=>[h.ip,h]));
const byName=new Map();hosts.forEach(h=>h.names.forEach(n=>byName.set(n,h.ip)));
const badTls=t=>!!t&&(!t.valid||t.days<30);
const services=hosts.flatMap(h=>h.ports.map(p=>{const st=p.http.map(c=>c.status).filter(x=>x!=null);
  return{host:h,port:p.port,lat:p.lat,tls:p.tls,http:p.http,worst:st.length?Math.max(...st):null,
   bad:badTls(p.tls)||p.http.some(c=>c.status>=400||c.status==null)}}));
const checks=services.flatMap(s=>s.http.map(c=>({host:s.host,port:s.port,...c,bad:c.status>=400||c.status==null})));
const hostRows=hosts.map(h=>{const sv=services.filter(s=>s.host===h),tl=sv.map(s=>s.tls).filter(Boolean);
  return{host:h,svc:sv,n:sv.length,lat:sv.length?Math.min(...sv.map(s=>s.lat)):null,days:tl.length?Math.min(...tl.map(t=>t.days)):null,
   ver:tl.length?tl.map(t=>t.version).sort()[0]:null,sans:new Set(tl.flatMap(t=>t.sans)).size||null,
   worst:sv.length&&sv.some(s=>s.worst!=null)?Math.max(...sv.map(s=>s.worst||0)):null,bad:sv.some(s=>s.bad)}});

/* ---------- cell renderers ---------- */
const dash='<span class="muted">–</span>';
const R={
 host:r=>`<button class="link mono" data-act="open" data-ip="${r.host.ip}">${r.host.ip}</button>`,
 names:r=>r.host.names.slice(0,2).map(esc).join(', ')+(r.host.names.length>2?` <span class="muted">+${r.host.names.length-2}</span>`:''),
 depth:r=>r.host.skipped?`<span class="badge warn">${r.host.skipped.depth} &gt; ${r.host.skipped.max}</span>`:r.host.depth==null?dash:r.host.depth===0?'0 (target)':`<span class="badge info">${r.host.depth}</span>`,
 state:r=>r.host.skipped?'<span class="badge warn">Skipped – exceeds max depth</span>':'<span class="badge ok">Scanned</span>',
 port:r=>`<span class="badge">${r.port}</span>`,
 ports:r=>r.n?r.svc.slice(0,3).map(s=>`<span class="badge">${s.port}</span>`).join('')+(r.n>3?`<button class="link" data-act="show" data-view="services" data-ip="${r.host.ip}">+${r.n-3} more</button>`:''):dash,
 ms:v=>v==null?dash:v+' ms',
 expiry:d=>d==null?dash:`<span class="badge ${d<0?'bad':d<30?'warn':'ok'}">${d<0?'expired '+(-d)+'d':d+' days'}</span>`,
 ver:v=>v?`<span class="badge ${v<'TLSv1.2'?'bad':''}">${v}</span>`:dash,
 status:(s,n,notes)=>s==null?`<span class="badge bad" title="${esc(notes||'')}">${esc(notes||'no response')}</span>`:`<span class="badge ${s>=400?'bad':s>=300?'warn':'ok'}">${s}</span>`+(n>1?`<span class="muted">+${n-1}</span>`:''),
 redirect:u=>{if(!u)return dash;let host=u;try{host=new URL(u).host}catch(e){}const ip=byName.get(host);
   return `→ <span class="mono">${esc(u)}</span> `+(ip?`<button class="link" data-act="open" data-ip="${ip}">(${ip})</button>`:'<span class="badge">not in scan</span>')},
 sans:l=>!l||!l.length?dash:l.slice(0,2).map(s=>`<span class="badge">${esc(s)}</span>`).join('')+(l.length>2?`<span class="muted">+${l.length-2}</span>`:'')
};
const VIEWS={

  ['SANs',r=>r.sans,r=>r.sans??dash],['HTTP (worst)',r=>r.worst,r=>R.status(r.worst,r.svc.reduce((a,s)=>a+s.http.length,0))]]},

  ['SANs',r=>r.tls?.sans.length,r=>R.sans(r.tls?.sans)],['HTTP (worst)',r=>r.worst,r=>R.status(r.worst,r.http.length,r.http[0]?.notes)]]},

function filtered(){const V=VIEWS[S.view],q=S.q.toLowerCase();
  let rows=V.rows().filter(r=>(!S.ip||r.host.ip===S.ip)&&(!q||r.host.ip.includes(q)||r.host.names.some(n=>n.includes(q))||(r.domain||'').includes(q))
   &&(S.flt==='all'||(S.flt==='anomaly'&&r.bad)||(S.flt==='discovered'&&r.host.depth>0)||(S.flt==='skipped'&&r.host.skipped)));
  const get=V.cols[S.sk][1];
  return rows.slice().sort((a,b)=>{const x=get(a),y=get(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(x<y?-1:x>y?1:0)*S.sd})}

function render(){const V=VIEWS[S.view],rows=filtered(),scanned=hosts.filter(h=>!h.skipped);
  $('#subtitle').textContent='Target: google.com · max out-of-scope depth: '+MAXD+' · closed ports are counted, never listed';
  $('#stats').innerHTML=[['Hosts found',hosts.length],['Scanned',scanned.length],['Skipped (depth)',hosts.length-scanned.length],['Open services',services.length],
   ['TLS invalid / <30d',services.filter(s=>badTls(s.tls)).length],['HTTP ≥ 400 / failed',checks.filter(c=>c.bad).length]].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
  $('#tabs').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button class="tab ${k===S.view?'active':''}" data-act="view" data-view="${k}">${v.label}<small>${v.rows().length}</small></button>`).join('');
  $('#search').value=S.q;$('#filter').value=S.flt;
  $('#chips').innerHTML=S.ip?`<span class="chip">Host: <span class="mono">${S.ip}</span> <button data-act="clearip" title="Clear host filter">×</button></span>`:'';
  $('#thead').innerHTML=V.cols.map((c,i)=>`<th data-act="sort" data-i="${i}">${c[0]}${i===S.sk?(S.sd>0?' ▲':' ▼'):''}</th>`).join('');
  $('#tbody').innerHTML=rows.slice(S.page*PS,S.page*PS+PS).map(r=>`<tr class="${r.host.skipped?'skipped':''}">${V.cols.map(c=>`<td>${c[2](r)}</td>`).join('')}</tr>`).join('')
   ||`<tr><td colspan="${V.cols.length}" class="muted">No rows match.</td></tr>`;
  $('#pageinfo').textContent=`${rows.length?S.page*PS+1:0}–${Math.min(rows.length,S.page*PS+PS)} of ${rows.length}`;
  $('#prev').disabled=S.page===0;$('#next').disabled=(S.page+1)*PS>=rows.length;
  renderDrawer()}

function renderDrawer(){const d=$('#drawer'),h=byIp.get(S.drawer);d.classList.toggle('open',!!h);$('#overlay').classList.toggle('open',!!h);if(!h){d.innerHTML='';return}
  const sv=services.filter(s=>s.host===h),sans=[...new Set(sv.flatMap(s=>s.tls?s.tls.sans:[]))],ck=checks.filter(c=>c.host===h);
  d.innerHTML=`<button class="btn x" data-act="close">Close</button>
  <h2 class="mono">${h.ip}</h2>
  <div class="muted">${h.skipped?'Skipped – exceeds max depth ('+h.skipped.depth+' &gt; '+h.skipped.max+')':sv.length+' open / '+h.scanned+' scanned ports'}</div>
  <h3>Discovery</h3>
  <div>Depth: ${R.depth({host:h})}</div>
  <div>Names pointing here: ${h.names.map(n=>`<span class="badge">${esc(n)}</span>`).join('')}</div>
  <div class="muted">Discovering host/SAN: not recorded by the engine (metadata.discovered_from is empty).</div>
  <p><button class="btn" data-act="show" data-view="services" data-ip="${h.ip}">Show in Services</button>
  <button class="btn" data-act="show" data-view="checks" data-ip="${h.ip}">Show in HTTP checks</button></p>
  <h3>Services (${sv.length})</h3>
  ${sv.length?`<table><thead><tr><th>Port</th><th>TCP</th><th>TLS expires</th><th>Version</th><th>Issuer</th><th>HTTP</th></tr></thead><tbody>${sv.map(s=>`<tr><td>${R.port(s)}</td><td>${R.ms(s.lat)}</td><td>${R.expiry(s.tls?.days)}</td><td>${R.ver(s.tls?.version)}</td><td>${s.tls?esc(s.tls.issuer):'–'}</td><td>${R.status(s.worst,s.http.length,s.http[0]?.notes)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No open ports.</div>'}
  <h3>HTTP checks (${ck.length})</h3>
  ${ck.length?`<table><thead><tr><th>Port</th><th>Domain</th><th>Status</th><th>Redirect</th></tr></thead><tbody>${ck.map(c=>`<tr><td>${R.port(c)}</td><td>${esc(c.domain)}</td><td>${R.status(c.status,1,c.notes)}</td><td>${R.redirect(c.redirect)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">None.</div>'}
  <h3>Certificate SANs (${sans.length})</h3>
  <div>${sans.map(s=>`<span class="badge">${esc(s)}</span>`).join('')||'<span class="muted">None.</span>'}</div>`}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='open')go({drawer:t.dataset.ip},false);
  else if(a==='close')go({drawer:''},false);
  else if(a==='view')go({view:t.dataset.view,sk:0,sd:1});
  else if(a==='show')go({view:t.dataset.view,ip:t.dataset.ip,drawer:'',sk:0,sd:1});
  else if(a==='clearip')go({ip:''});
  else if(a==='sort'){const i=+t.dataset.i;go({sk:i,sd:S.sk===i?-S.sd:1})}});
$('#search').addEventListener('input',e=>go({q:e.target.value}));
$('#filter').addEventListener('change',e=>go({flt:e.target.value}));
$('#prev').onclick=()=>go({page:Math.max(0,S.page-1)},false);
$('#next').onclick=()=>go({page:S.page+1},false);
window.addEventListener('popstate',()=>{parse();render()});
parse();render();
</script></body></html>
