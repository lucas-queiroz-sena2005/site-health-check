[project]
name = "api"
version = "0.1.0"
description = "Web Health Auditor & Reconnaissance Tool"
authors = [{ name = "Lucas Queiroz", email = "author@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "engine",
  "requests>=2.31.0,<3",
  "cryptography>=50.0.0,<51",
  "aiohttp>=3.8.0,<4",
  "fastapi[standard]>=0.141.1,<0.142",
  "sqlmodel>=0.0.42,<0.0.43",
  "pydantic>=2.13.5,<3",
  "croniter>=2.0.0,<3",
]

[tool.uv.sources]
engine = { workspace = true }

[tool.fastapi]
entrypoint = "api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
