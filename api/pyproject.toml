[tool.poetry]
name = "api"
version = "0.1.0"
description = "Web Health Auditor & Reconnaissance Tool"
authors = ["Lucas Queiroz <author@example.com>"]
readme = "README.md"
packages = [
  { include = "api", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.14"
engine = { path = "../engine", develop = true }
requests = "^2.31.0"
cryptography = "^50.0.0"
aiohttp = "^3.8.0"
fastapi = {extras = ["standard"], version = "^0.141.1"}
sqlmodel = "^0.0.42"
pydantic = "^2.13.5"
croniter = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
