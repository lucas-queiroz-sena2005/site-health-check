[project]
name = "engine"
version = "0.1.0"
description = "Web Health Auditor & Reconnaissance Tool"
authors = [{ name = "Lucas Queiroz", email = "author@example.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31.0,<3",
  "cryptography>=50.0.0,<51",
  "aiohttp>=3.8.0,<4",
  "fastapi[standard]>=0.141.1,<0.142",
  "sqlmodel>=0.0.42,<0.0.43",
  "pydantic>=2.13.5,<3",
]

[project.scripts]
site-check = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
