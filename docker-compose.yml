version: '3.8'

services:
  frontend:
    build: ./frontend-prototype
    container_name: site-health-check-prototype
    ports:
      - "8080:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: site-health-check-backend
    ports:
      - "8000:8000"
    volumes:
      - site_health_data:/data
    restart: unless-stopped

volumes:
  site_health_data:
