version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: site-health-check-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: site-health-check-backend
    ports:
      - "8000:8000"
    volumes:
      - site_health_data:/data
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: site-health-check-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  site_health_data:
