version: '3.8'

services:
  frontend:
    build: ./frontend
    image: localhost/site-health-check-frontend
    container_name: site-health-check-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    env_file:
      - .env
    volumes:
      - ./certbot/conf:/etc/letsencrypt:z
      - ./certbot/www:/var/www/certbot:z
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: localhost/site-health-check-backend
    container_name: site-health-check-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - site_health_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  certbot:
    image: docker.io/certbot/certbot
    container_name: site-health-check-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:z
      - ./certbot/www:/var/www/certbot:z
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  site_health_data:
