<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" height="auto" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

    <!-- Header -->
    <rect x="20" y="20" width="1200" height="75" rx="8" fill="#131c31" stroke="#1e293b" />
    <text x="40" y="52" fill="#ffffff" font-size="20" font-weight="700">Concurrency Architecture &amp; SQLite Lock-Prevention Flow</text>
    <text x="40" y="74" fill="#94a3b8" font-size="12">Multi-layered defense: In-Memory Runner Locks, SQLite Write-Ahead Logging (WAL), 5s Busy Queuing, and Single-Transaction Evaluation</text>
    
    <!-- Legend -->
    <rect x="790" y="32" width="12" height="12" rx="3" fill="#38bdf8" />
    <text x="810" y="43" fill="#cbd5e1" font-size="11">Sequential RPC / Event</text>
    
    <rect x="940" y="32" width="12" height="12" rx="3" fill="#4ade80" />
    <text x="960" y="43" fill="#cbd5e1" font-size="11">Non-Blocking WAL Read</text>
    
    <rect x="1090" y="32" width="12" height="12" rx="3" fill="#fbbf24" />
    <text x="1110" y="43" fill="#cbd5e1" font-size="11">Protected / Atomic Region</text>
    
<line x1="110" y1="160" x2="110" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="25" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#38bdf8" stroke-width="2" />
          <text x="110" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Web Frontend</text>
          <text x="110" y="153" fill="#38bdf8" font-size="11" text-anchor="middle">React UI / Client</text>
        </g>
        
<line x1="320" y1="160" x2="320" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="235" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#818cf8" stroke-width="2" />
          <text x="320" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">FastAPI App</text>
          <text x="320" y="153" fill="#818cf8" font-size="11" text-anchor="middle">REST &amp; SSE Router</text>
        </g>
        
<line x1="530" y1="160" x2="530" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="445" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#fbbf24" stroke-width="2" />
          <text x="530" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Scan Runner</text>
          <text x="530" y="153" fill="#fbbf24" font-size="11" text-anchor="middle">asyncio.Lock Guard</text>
        </g>
        
<line x1="740" y1="160" x2="740" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="655" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#c084fc" stroke-width="2" />
          <text x="740" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Engine Workers</text>
          <text x="740" y="153" fill="#c084fc" font-size="11" text-anchor="middle">Async TCP / TLS / HTTP</text>
        </g>
        
<line x1="940" y1="160" x2="940" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="855" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#f472b6" stroke-width="2" />
          <text x="940" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Evaluator</text>
          <text x="940" y="153" fill="#f472b6" font-size="11" text-anchor="middle">Bottom-Up Pipeline</text>
        </g>
        
<line x1="1130" y1="160" x2="1130" y2="890" stroke="#223049" stroke-width="2" stroke-dasharray="6,4" />

        <g filter="url(#shadow)">
          <rect x="1045" y="115" width="170" height="48" rx="6" fill="#182238" stroke="#4ade80" stroke-width="2" />
          <text x="1130" y="137" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">SQLite Engine</text>
          <text x="1130" y="153" fill="#4ade80" font-size="11" text-anchor="middle">WAL + PRAGMAs</text>
        </g>
        

    <!-- Step 1: Scan Trigger -->
    <line x1="110" y1="195" x2="320" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <circle cx="135" cy="183" r="10" fill="#38bdf8" />
    <text x="135" y="187" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="155" y="187" fill="#ffffff" font-size="12" font-weight="600">POST /api/scans/&#123;id&#125;/run</text>
    <text x="155" y="211" fill="#94a3b8" font-size="11">User triggers scan execution</text>
    

    <!-- Step 2: In-Memory Lock Guard -->
    <line x1="320" y1="250" x2="530" y2="250" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)" />
    <circle cx="345" cy="238" r="10" fill="#fbbf24" />
    <text x="345" y="242" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="365" y="242" fill="#ffffff" font-size="12" font-weight="600">acquire asyncio.Lock(scan_id)</text>
    
    <!-- Lock Guard Note Box -->
    <rect x="420" y="262" width="220" height="44" rx="5" fill="#252117" stroke="#fbbf24" stroke-width="1.5" />
    <text x="530" y="278" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">GUARD 1: In-Memory Worker Lock</text>
    <text x="530" y="294" fill="#e2e8f0" font-size="10" text-anchor="middle">Guarantees strictly 1 active writer per scan</text>
    

    <!-- Step 3: Insert Running State -->
    <line x1="530" y1="330" x2="1130" y2="330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <circle cx="555" cy="318" r="10" fill="#38bdf8" />
    <text x="555" y="322" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="575" y="322" fill="#ffffff" font-size="12" font-weight="600">INSERT INTO scan_runs (status='running')</text>
    <text x="575" y="346" fill="#94a3b8" font-size="11">Appends to SQLite WAL log (write lock held for &lt;1ms)</text>
    

    <!-- Step 4: Launch Engine -->
    <line x1="530" y1="385" x2="740" y2="385" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
    <circle cx="555" cy="373" r="10" fill="#c084fc" />
    <text x="555" y="377" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="575" y="377" fill="#ffffff" font-size="12" font-weight="600">execute_scan(targets, ports, flags)</text>
    <text x="575" y="401" fill="#94a3b8" font-size="11">JSON passed over stdin via python -m engine.cli --config -</text>
    

    <!-- Concurrent Zone Box -->
    <rect x="40" y="430" width="1160" height="205" rx="8" fill="#10192e" stroke="#2563eb" stroke-dasharray="6,4" stroke-width="1.5" />
    <rect x="50" y="418" width="380" height="24" rx="4" fill="#1e3a8a" />
    <text x="60" y="434" fill="#bfdbfe" font-size="11" font-weight="700">CONCURRENT ZONE: Background Probing vs. Real-Time UI Queries</text>
    

    <!-- Step 5: Delta Streaming -->
    <line x1="740" y1="475" x2="530" y2="475" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
    <circle cx="710" cy="463" r="10" fill="#c084fc" />
    <text x="710" y="467" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <text x="560" y="467" fill="#ffffff" font-size="12" font-weight="600">Streaming JSON deltas (stdout)</text>
    
    <line x1="530" y1="500" x2="1130" y2="500" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="575" y="495" fill="#ffffff" font-size="12" font-weight="600">_upsert_delta_sync (ON CONFLICT DO UPDATE)</text>
    <text x="575" y="515" fill="#94a3b8" font-size="11">Set-unions resolved_domains &amp; discovered_from; derives depth</text>
    

    <!-- Step 6: Non-Blocking Concurrent UI Read -->
    <line x1="110" y1="560" x2="320" y2="560" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)" />
    <circle cx="135" cy="548" r="10" fill="#4ade80" />
    <text x="135" y="552" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">6</text>
    <text x="155" y="552" fill="#ffffff" font-size="12" font-weight="600">GET /api/scans/&#123;id&#125;/runs (Live Polling)</text>
    
    <line x1="320" y1="585" x2="1130" y2="585" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="365" y="580" fill="#4ade80" font-size="12" font-weight="700">PRAGMA journal_mode=WAL: Non-Blocking Concurrent Read</text>
    <text x="365" y="600" fill="#cbd5e1" font-size="11">Reader queries snapshot from -shm/-wal without waiting for background writer!</text>
    
    <!-- WAL / Busy timeout Note box -->
    <rect x="910" y="565" width="290" height="46" rx="5" fill="#143324" stroke="#4ade80" stroke-width="1.5" />
    <text x="1055" y="583" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">GUARD 2: WAL + busy_timeout=5000</text>
    <text x="1055" y="600" fill="#e2e8f0" font-size="10" text-anchor="middle">Never raises 'database is locked'</text>
    

    <!-- Step 7: Finalization & Evaluator -->
    <line x1="530" y1="675" x2="940" y2="675" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow-pink)" />
    <circle cx="555" cy="663" r="10" fill="#f472b6" />
    <text x="555" y="667" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">7</text>
    <text x="575" y="667" fill="#ffffff" font-size="12" font-weight="600">evaluate_scan_run(session, scan_run_id)</text>
    
    <!-- Evaluator Pipeline Box -->
    <rect x="680" y="687" width="420" height="65" rx="6" fill="#2d1527" stroke="#f472b6" stroke-width="1.5" />
    <text x="890" y="705" fill="#f9a8d4" font-size="11" font-weight="700" text-anchor="middle">GUARD 3: Deterministic Bottom-Up In-Memory Rollup</text>
    <text x="890" y="722" fill="#fce7f3" font-size="10" text-anchor="middle">L1: HTTP Routing Findings &#8594; L2: Port Rollup (worst TLS/HTTP)</text>
    <text x="890" y="738" fill="#fce7f3" font-size="10" text-anchor="middle">&#8594; L3: Host Rollup (min latency, vhost count, overall status ok/warn/failed)</text>
    

    <!-- Step 8: Atomic SQLite Commit -->
    <line x1="940" y1="775" x2="1130" y2="775" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)" />
    <circle cx="965" cy="763" r="10" fill="#4ade80" />
    <text x="965" y="767" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">8</text>
    <text x="985" y="767" fill="#ffffff" font-size="12" font-weight="600">Atomic session.commit()</text>
    <text x="985" y="791" fill="#94a3b8" font-size="11">Persists all rollups &amp; marks status='completed' in 1 commit</text>
    

    <!-- Step 9: Release Lock & SSE -->
    <line x1="530" y1="835" x2="110" y2="835" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)" />
    <circle cx="500" cy="823" r="10" fill="#38bdf8" />
    <text x="500" y="827" fill="#0b1120" font-size="11" font-weight="700" text-anchor="middle">9</text>
    <text x="170" y="827" fill="#ffffff" font-size="12" font-weight="600">SSE Event: scan_completed | Lock Released</text>
    <text x="170" y="851" fill="#94a3b8" font-size="11">UI instantly queries cached pre-computed tables with 0 joins</text>
    

        <g filter="url(#shadow)">
          <rect x="40" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#38bdf8" stroke-width="1.5" />
          <text x="110" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Web Frontend</text>
        </g>
        

        <g filter="url(#shadow)">
          <rect x="250" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#818cf8" stroke-width="1.5" />
          <text x="320" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">FastAPI App</text>
        </g>
        

        <g filter="url(#shadow)">
          <rect x="460" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#fbbf24" stroke-width="1.5" />
          <text x="530" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Scan Runner</text>
        </g>
        

        <g filter="url(#shadow)">
          <rect x="670" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#c084fc" stroke-width="1.5" />
          <text x="740" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Engine Workers</text>
        </g>
        

        <g filter="url(#shadow)">
          <rect x="870" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#f472b6" stroke-width="1.5" />
          <text x="940" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Evaluator</text>
        </g>
        

        <g filter="url(#shadow)">
          <rect x="1060" y="890" width="140" height="32" rx="4" fill="#182238" stroke="#4ade80" stroke-width="1.5" />
          <text x="1130" y="910" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">SQLite Engine</text>
        </g>
        

    <rect x="20" y="935" width="1200" height="34" rx="6" fill="#111c33" stroke="#1e293b" />
    <text x="35" y="956" fill="#94a3b8" font-size="11" font-weight="700">ACTIVE SQLITE PRAGMAS:</text>
    <text x="210" y="956" fill="#38bdf8" font-size="11">PRAGMA journal_mode = WAL;</text>
    <text x="470" y="956" fill="#4ade80" font-size="11">PRAGMA foreign_keys = ON; (CASCADE)</text>
    <text x="770" y="956" fill="#fbbf24" font-size="11">PRAGMA busy_timeout = 5000;</text>
    <text x="1030" y="956" fill="#c084fc" font-size="11">PRAGMA synchronous = NORMAL;</text>
    
</svg>