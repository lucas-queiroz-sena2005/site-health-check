[tool.poetry]
name = "site-health-check"
version = "0.1.0"
description = "Web Health Auditor & Reconnaissance Tool"
authors = ["Lucas Queiroz <author@example.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
engine = { path = "./engine", develop = true }
api = { path = "./api", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"

[tool.poetry.scripts]
site-check = "engine.cli:main"

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
