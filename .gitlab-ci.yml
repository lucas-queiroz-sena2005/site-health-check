stages:
  - build
  - deploy

variables:
  IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend:latest
  IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend:latest

build_images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_BACKEND -f Dockerfile.backend .
    - docker build -t $IMAGE_FRONTEND ./frontend
    - docker push $IMAGE_BACKEND
    - docker push $IMAGE_FRONTEND
  only:
    - main
    - production

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $SERVER_USER@$SERVER_IP "podman pull $IMAGE_BACKEND"
    - ssh $SERVER_USER@$SERVER_IP "podman pull $IMAGE_FRONTEND"
    - ssh $SERVER_USER@$SERVER_IP "podman stop backend frontend || true"
    - ssh $SERVER_USER@$SERVER_IP "podman rm backend frontend || true"
    - ssh $SERVER_USER@$SERVER_IP "podman run -d --name backend --restart unless-stopped -p 8000:8000 $IMAGE_BACKEND"
    - ssh $SERVER_USER@$SERVER_IP "podman run -d --name frontend --restart unless-stopped -p 80:80 $IMAGE_FRONTEND"
  only:
    - main
    - production
